<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IBM Fusion Backup &amp; Restore in action</title>
<style>
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1f2328; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #57606a; font-size: 13px; margin-bottom: 14px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  button, select { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid #c9ced6; background: #fff; border-radius: 6px; cursor: pointer; }
  button.active { background: #3b82d4; color: #fff; border-color: #3b82d4; }
  button:disabled { background: #eef0f3; color: #a0a7b2; border-color: #e1e4e8; cursor: not-allowed; }
  .spacer { flex: 1; }
  svg { width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; display: block; }
  #cap { margin-top: 10px; padding: 12px 14px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; min-height: 48px; font-size: 14px; line-height: 1.5; }
  #cap b { color: #3b82d4; }
  .note { font-size: 12px; color: #57606a; margin-top: 10px; line-height: 1.5; }
  code { background: #eef0f3; padding: 0 4px; border-radius: 3px; font-size: 12.5px; }

  .bxg { transition: opacity .5s; }
  .bxg rect { fill: #fff; stroke: #8b95a3; stroke-width: 1.3; transition: fill .4s, stroke .4s; }
  .bxg.dash rect { stroke-dasharray: 5 4; }
  .bxg.good rect { fill: #e8f6ee; stroke: #1a7f37; }
  .bxg.bad rect { fill: #fdecec; stroke: #d64545; }
  .bxg.warn rect { fill: #fff4e0; stroke: #d98a00; }
  .bxg.hot rect { fill: #e3f0fc; stroke: #3b82d4; }
  .bxg.purple rect { fill: #efe9fb; stroke: #7c5cd8; }
  .bxg.teal rect { fill: #e0f4f4; stroke: #0f8b8d; }
  .bxg.off { opacity: .35 !important; }
  .bt { font-size: 12px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
  .bs { font-size: 10.5px; fill: #57606a; text-anchor: middle; }
  .cont { transition: opacity .5s; }
  .cont rect { fill: #f7f8fa; stroke: #b6bcc6; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .ct { font-size: 12.5px; font-weight: 600; fill: #1f2328; }
  .ln { stroke: #b6bcc6; stroke-width: 1.5; fill: none; transition: opacity .5s, stroke .4s; }
  .ln.good { stroke: #1a7f37; stroke-width: 2.2; }
  .ln.bad { stroke: #d64545; stroke-width: 2.2; stroke-dasharray: 5 4; }
  .ln.dash { stroke-dasharray: 5 4; }
  .badge { font-size: 11.5px; text-anchor: middle; fill: #57606a; transition: opacity .5s; }
  .badge.hdr { font-size: 12.5px; font-weight: 700; fill: #1f2328; }
  .badge.bad { fill: #b42318; font-weight: 600; }
  .badge.warn { fill: #9a6700; font-weight: 600; }
  .badge.good { fill: #1a7f37; font-weight: 600; }
  .badge.big { font-size: 13px; font-weight: 700; fill: #1d4f87; }
  .x { font-size: 22px; font-weight: 700; fill: #d64545; text-anchor: middle; }
  .pkt { stroke: #fff; stroke-width: 1.5; }
  .pkt.w { fill: #3b82d4; }
  .pkt.r { fill: #7c5cd8; }
  .pkt.a { fill: #1a7f37; }
  .pkt.o { fill: #d98a00; }
  .cell { fill: #fff; stroke: #c9ced6; stroke-width: 1; transition: fill .3s, opacity .4s; }
  .cell.hot { fill: #3b82d4; stroke: #1d4f87; }
  .cell.warn { fill: #d98a00; stroke: #8a5a00; }
  .cell.scan { stroke: #7c5cd8; stroke-width: 3; }
  .cell.off { fill: #f1f3f5; stroke-dasharray: 2 2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>IBM Fusion Backup &amp; Restore in action</h1>
  <div class="sub">Four ideas, one tab each. Click-through by default: press Next (or the right arrow or space) for each step.</div>
  <div class="bar">
    <span class="spacer"></span>
    <button id="md">Mode: Click-through</button>
    <button id="pv" disabled>&#9664; Previous</button>
    <button id="nx" disabled>Next &#9654;</button>
    <button id="pp" disabled>Pause</button>
    <button id="rs">Restart</button>
    <label style="font-size:13px">Speed
      <select id="sp"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
    </label>
  </div>
  <div class="tabs">
    <button class="tab active" data-s="1">1 &middot; Any storage, spread across nodes</button>
    <button class="tab" data-s="2">2 &middot; Full, incremental, CBT</button>
    <button class="tab" data-s="3">3 &middot; Hub and spokes</button>
    <button class="tab" data-s="4">4 &middot; Recipes</button>
  </div>
  <svg id="svg" viewBox="0 0 960 480"></svg>
  <div id="cap"></div>
  <div class="note" id="note"></div>
</div>

<script>
const svg = document.getElementById('svg');
const cap = document.getElementById('cap');
const NS = 'http://www.w3.org/2000/svg';
let scene = 1, paused = false, speed = 1, token = 0;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function wait(ms) {
  const my = token; let t = 0;
  if (skipping || ffwd) { if (my !== token) throw 'cancel'; return; }
  while (t < ms) {
    await sleep(40);
    if (my !== token) throw 'cancel';
    if (ffwd) break;
    if (!paused) t += 40 * speed;
  }
  if (my !== token) throw 'cancel';
}
function say(html) { cap.innerHTML = html; }

// Pause between steps: timed in auto mode, waits for "Next" in click-through mode.
// "Previous" re-runs the scene, fast-forwarding (skipping = true) past the first
// `skipLeft` pauses with no animation, then plays normally up to the target pause.
let stepMode = true, release = null;   // click-through is the default mode
let ffwd = false;   // Next pressed mid-step: finish the current step instantly
let skipping = false, skipLeft = 0;
let idx = 0;   // pauses reached so far in this run
let cur = 0;   // pauses the viewer has passed (the pause they are at, or the end)
function setCur(v) { cur = v; updateNav(); }
async function dwell(ms) {
  const j = idx++;
  if (skipLeft > 0) { skipLeft--; if (skipLeft === 0) skipping = false; setCur(j + 1); return; }
  setCur(j);
  ffwd = false;   // the step is complete; wait here for the next click
  if (!stepMode) { await wait(ms); setCur(j + 1); return; }
  const my = token;
  let mine;
  await new Promise(r => { mine = r; release = r; });
  if (my !== token) throw 'cancel';   // superseded by a newer run; leave its state alone
  if (release === mine) release = null;
  setCur(j + 1);
}
function next() {
  if (release) release();
  else if (stepMode && !finished) ffwd = true;
}
function prev() { if (stepMode) run(Math.max(0, cur - 1)); }

/* ---------------- drawing helpers ---------------- */
let L;   // main layer
function E(tag, a, p) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  (p || L).appendChild(e);
  return e;
}
// Box with a title and an optional second line. o.h = start hidden, o.c = state, o.d = dashed.
function box(id, x, y, w, h, title, sub, o = {}) {
  const g = E('g', { id, class: 'bxg' + (o.c ? ' ' + o.c : '') + (o.d ? ' dash' : '') });
  E('rect', { x, y, width: w, height: h, rx: 6 }, g);
  g.dataset.cy = y + h / 2;
  const t = E('text', { class: 'bt', x: x + w / 2, y: sub ? y + h / 2 - 3 : y + h / 2 + 4 }, g);
  t.textContent = title;
  const s = E('text', { class: 'bs', x: x + w / 2, y: y + h / 2 + 12 }, g);
  s.textContent = sub || '';
  if (o.h) g.style.opacity = 0;
  return g;
}
function cont(id, x, y, w, h, label, o = {}) {
  const g = E('g', { id, class: 'cont' });
  E('rect', { x, y, width: w, height: h, rx: 10 }, g);
  const t = E('text', { class: 'ct', x: x + 12, y: y + 20 }, g);
  t.textContent = label;
  if (o.h) g.style.opacity = 0;
  return g;
}
function tag(id, x, y, text, cls) {
  const t = E('text', { id, x, y, class: 'badge ' + (cls || '') });
  t.textContent = text;
  return t;
}
function setTag(id, text, cls) { const b = $(id); b.textContent = text; b.setAttribute('class', 'badge ' + (cls || '')); }
function line(id, x1, y1, x2, y2, cls, hidden) {
  const l = E('line', { id, x1, y1, x2, y2, class: 'ln ' + (cls || '') });
  if (hidden) l.style.opacity = 0;
  return l;
}
function setLn(id, cls) { $(id).setAttribute('class', 'ln ' + (cls || '')); }
function setT(id, title, sub) {
  const g = $(id);
  g.querySelector('.bt').textContent = title;
  if (sub !== undefined) {
    g.querySelector('.bs').textContent = sub;
    g.querySelector('.bt').setAttribute('y', +g.dataset.cy + (sub ? -3 : 4));   // keep title clear of the second line
  }
}
const STATES = ['good', 'bad', 'warn', 'hot', 'purple', 'teal', 'off', 'dash'];
function st(id, s) { const g = $(id); STATES.forEach(x => g.classList.remove(x)); if (s) g.classList.add(s); }
function show(id, on = true) { $(id).style.opacity = on ? 1 : 0; }
function showAll(ids, on = true) { ids.forEach(i => show(i, on)); }
function xmark(x, y) { const t = E('text', { class: 'x', x, y }); t.textContent = '\u2715'; return t; }
function cell(id, x, y, s, c, hidden) {
  const r = E('rect', { id, x, y, width: s, height: s, rx: 3, class: 'cell ' + (c || '') });
  if (hidden) r.style.opacity = 0;
  return r;
}
function cc(id, c) { $(id).setAttribute('class', 'cell ' + (c || '')); }

// Move a dot along a polyline; every segment takes d ms.
async function ship(points, cls, d = 450) {
  if (skipping || ffwd) return;
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('r', 6); c.setAttribute('class', 'pkt ' + cls);
  c.style.transition = 'none';
  c.style.transform = `translate(${points[0][0]}px,${points[0][1]}px)`;
  $('layer-pk').appendChild(c);
  c.getBoundingClientRect();
  for (let k = 1; k < points.length; k++) {
    c.style.transition = `transform ${d / speed}ms linear`;
    c.style.transform = `translate(${points[k][0]}px,${points[k][1]}px)`;
    await wait(d);
  }
  c.remove();
}

/* ======================================================================
   Scene 3: hub and spokes
   ====================================================================== */
function build3() {
  cont('hub', 20, 20, 400, 350, 'Hub cluster');
  box('pol', 40, 60, 110, 44, 'Policy', 'schedule, retention', { h: true });
  box('jm', 160, 60, 110, 44, 'Job manager', 'sends jobs out', { h: true });
  box('bsv', 280, 60, 115, 44, 'Backup service', 'job status', { h: true });
  box('mongo', 40, 112, 110, 44, 'MongoDB', 'metadata', { h: true });
  box('kafka', 160, 112, 110, 44, 'Kafka', 'messaging', { h: true });
  box('redis', 280, 112, 115, 44, 'Redis', 'locks', { h: true });
  box('hag', 40, 175, 175, 50, 'Hub agent', 'backs up the hub apps', { h: true });
  box('ui', 230, 175, 165, 50, 'Fusion UI', 'Jobs, Topology', { h: true });
  box('polc', 40, 250, 355, 60, 'Backup policy: daily, keep 7 days', 'location: S3 bucket (example values)', { h: true, c: 'good' });
  cont('spA', 500, 20, 440, 155, 'Spoke cluster A', { h: true });
  box('agA', 520, 55, 190, 50, 'Agent not installed', '', { h: true, c: 'warn', d: true });
  box('appA', 730, 55, 190, 50, 'App namespaces', 'apps and PVCs', { h: true });
  box('dmA', 520, 115, 190, 45, 'Datamover', 'reads the snapshot', { h: true, c: 'hot' });
  cont('spB', 500, 195, 440, 155, 'Spoke cluster B', { h: true });
  box('agB', 520, 230, 190, 50, 'Agent not installed', '', { h: true, c: 'warn', d: true });
  box('appB', 730, 230, 190, 50, 'App namespaces', 'apps and PVCs', { h: true });
  box('dmB', 520, 290, 190, 45, 'Datamover', 'reads the snapshot', { h: true, c: 'hot' });
  box('s3', 500, 385, 440, 65, 'S3-compatible object storage', 'IBM Cloud, AWS, Azure, any S3-compliant store', { h: true, c: 'purple' });
  line('linkA', 420, 80, 500, 80, 'dash', true);
  line('linkB', 420, 255, 500, 255, 'dash', true);
  tag('tkA', 460, 72, '', '');
  tag('tkB', 460, 247, '', '');
}
async function installAgent(k, y) {
  setT('ag' + k, 'Backup & Restore Agent', 'installed with Fusion'); st('ag' + k, 'hot');
  show('ag' + k);
  setTag('tk' + k, 'token', 'warn');
  await ship([[420, y], [500, y]], 'a', 600);
  await ship([[500, y], [420, y]], 'w', 600);   // snippet request goes the other way first, token answers
}
async function scene3() {
  say('<b>1. One hub, many clusters.</b> The hub holds the Backup &amp; Restore server: scheduling, retention, policies and locations. An administrator logs in here to manage every cluster. Spoke clusters have no server yet.');
  showAll(['pol', 'jm', 'bsv', 'mongo', 'kafka', 'redis', 'hag', 'ui', 'spA', 'agA', 'appA', 'spB', 'agB', 'appB', 's3']);
  await dwell(5000);

  say('<b>2. Add spoke A.</b> Install IBM Fusion and the Backup &amp; Restore <b>Agent</b> on it. The hub generates a temporary connection snippet, and you give it to the agent installation within an hour.');
  setT('agA', 'Backup & Restore Agent', 'installed with Fusion'); st('agA', 'hot');
  show('linkA'); setTag('tkA', 'token', 'warn');
  await ship([[420, 80], [500, 80]], 'a', 700);
  await dwell(4500);

  say('<b>3. A permanent link replaces the token.</b> The hub issues a certificate from its own certificate authority. By default it expires after 90 days, and Fusion renews it automatically.');
  setTag('tkA', 'cert', 'good'); setLn('linkA', 'good');
  await dwell(4500);

  say('<b>4. Add spoke B the same way.</b> Any number of spokes can join. The hub keeps one list of all clusters (the Topology page shows the hub first, then every spoke).');
  setT('agB', 'Backup & Restore Agent', 'installed with Fusion'); st('agB', 'hot');
  show('linkB'); setTag('tkB', 'token', 'warn');
  await ship([[420, 255], [500, 255]], 'a', 700);
  setTag('tkB', 'cert', 'good'); setLn('linkB', 'good');
  await dwell(4000);

  say('<b>5. One policy, applied to apps on every cluster.</b> You create the policy on the hub. When a backup starts, the job is sent to the cluster where the application lives.');
  show('polc');
  await Promise.all([ship([[150, 82], [215, 82], [460, 80], [520, 80]], 'w', 450), ship([[150, 82], [215, 140], [460, 255], [520, 255]], 'w', 450)]);
  await dwell(4500);

  say('<b>6. The agent runs the job locally.</b> It snapshots the PVC and mounts the snapshot as a separate PVC. The datamover reads from that copy, so the application is not touched.');
  showAll(['dmA', 'dmB']);
  await Promise.all([ship([[825, 105], [825, 137], [710, 137]], 'w', 450), ship([[825, 280], [825, 312], [710, 312]], 'w', 450)]);
  await dwell(4500);

  say('<b>7. Data goes to S3, status goes back to the hub.</b> Each cluster sends its own data to the object store. All backup and restore jobs from all clusters show on the hub Jobs page.');
  show('s3');
  await Promise.all([ship([[520, 137], [470, 137], [470, 417], [500, 417]], 'w', 450), ship([[520, 312], [470, 312], [470, 417], [500, 417]], 'w', 450)]);
  await ship([[500, 82], [420, 82]], 'a', 500);
  await dwell(4500);

  say('<b>8. The network drops.</b> The link between hub and spoke A breaks. Fusion is built to recover from disconnections of up to an hour, so a short outage does not fail the setup.');
  setLn('linkA', 'bad'); setTag('tkA', 'down', 'bad');
  await dwell(4500);

  setLn('linkA', 'good'); setTag('tkA', 'cert', 'good');
  say('<b>Result:</b> One hub manages backup and restore for the other clusters, and only the agent runs on a spoke. Because spokes can share one policy and one S3 location, many backups may start together and compete for the same network. Stagger schedules if that matters.');
}

/* ======================================================================
   Scene 1: jobs spread across nodes
   ====================================================================== */
const PVCS = [['PVC 1', 30, 0], ['PVC 2', 10, 0], ['PVC 3', 25, 1], ['PVC 4', 5, 2], ['PVC 5', 40, 1], ['PVC 6', 15, 2], ['PVC 7', 20, 3], ['PVC 8', 8, 3]];
const STORE = [['EBS', 'warn'], ['Ceph RBD', 'good'], ['CephFS', 'teal'], ['Generic CSI', 'hot']];   // [label, colour]
const ASSIGN = [[0, 1], [2, 3], [4], [5, 6, 7]];   // which PVCs each datamover pod gets
const nx3 = k => 40 + 225 * k;
const pvx = i => 12 + 117 * i;   // top-row PVC boxes: 114 wide
function build1() {
  PVCS.forEach((p, i) => box('p' + i, pvx(i), 14, 114, 44, p[0], p[1] + ' GB', { h: true }));
  cont('cl', 20, 75, 920, 285, 'Cluster with the Backup & Restore agent', { h: true });
  for (let k = 0; k < 4; k++) {
    cont('nd' + k, nx3(k), 105, 205, 240, 'Worker node ' + (k + 1), { h: true });
    box('dm' + k, nx3(k) + 20, 135, 165, 44, 'Datamover pod ' + (k + 1), 'moves data to S3', { h: true, c: 'purple' });
    tag('cnt' + k, nx3(k) + 102, 335, '', '');
  }
  // hypothetical: everything attached to node 1
  PVCS.forEach((p, i) => box('o' + i, nx3(0) + 10 + 95 * (i % 2), 190 + 34 * Math.floor(i / 2), 92, 28, p[0] + ': ' + p[1] + ' GB', '', { h: true }));
  // spread: attachments per node
  ASSIGN.forEach((list, k) => list.forEach((p, j) =>
    box('a' + p, nx3(k) + 10 + 95 * (j % 2), 190 + 34 * Math.floor(j / 2), 92, 28, PVCS[p][0] + ': ' + PVCS[p][1] + ' GB', '', { h: true, c: STORE[PVCS[p][2]][1] })));
  box('s3', 300, 410, 360, 52, 'S3 bucket', 'backup repository', { h: true, c: 'purple' });
  tag('mx', 480, 380, '', 'big');
}
async function scene1() {
  say('<b>1. An app with 8 PVCs.</b> They run on a cluster with several worker nodes, and the backup goes to an S3 bucket.');
  showAll(['p0', 'p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'cl', 'nd0', 'nd1', 'nd2', 'nd3', 's3']);
  await dwell(4000);

  say('<b>2. The PVCs can sit on any storage.</b> Here some use EBS, some Ceph RBD, some CephFS and some a generic CSI driver. Fusion works with any storage that has a CSI driver with snapshot support, so the storage type does not change how the backup works.');
  PVCS.forEach((p, i) => { setT('p' + i, p[0], p[1] + ' GB \u00b7 ' + STORE[p[2]][0]); st('p' + i, STORE[p[2]][1]); });
  await dwell(6000);

  say('<b>3. Fusion snapshots each PVC.</b> By default up to 20 snapshots run at once. Each snapshot is mounted as a separate PVC so the datamover can read it. Now imagine one datamover pod doing everything: all 8 snapshot PVCs attach to one node. Some storage limits how many PVCs one node can attach (IBM Cloud VPC Block is typically 10), so one busy node can hit that limit.');
  setT('dm0', 'One datamover pod', 'takes all 8 PVCs'); show('dm0');
  for (let i = 0; i < 8; i++) show('o' + i);
  setTag('cnt0', 'attached: 8 (limit e.g. 10)', 'warn');
  await dwell(5500);

  say('<b>4. Instead, several datamover pods start.</b> A new pod starts for each chunk of PVC capacity (default 10 GB per pod, <code>datamoverJobPodDataMinGB</code>). The PVCs attach on several nodes, so the load is shared.');
  for (let i = 0; i < 8; i++) show('o' + i, false);
  setT('dm0', 'Datamover pod 1', 'moves data to S3');
  showAll(['dm1', 'dm2', 'dm3']);
  const ships = [];
  ASSIGN.forEach((list, k) => list.forEach((p, j) => {
    ships.push(ship([[pvx(p) + 57, 58], [nx3(k) + 56 + 95 * (j % 2), 204 + 34 * Math.floor(j / 2)]], 'w', 700));
  }));
  await Promise.all(ships);
  for (let i = 0; i < 8; i++) show('a' + i);
  ASSIGN.forEach((list, k) => setTag('cnt' + k, 'attached: ' + list.length + ' (limit e.g. 10)', 'good'));
  await dwell(5500);

  say('<b>5. You can set the ceiling.</b> <code>MaxNumJobPods</code> limits how many datamover pods are used. It is set per cluster, so set it on each cluster on its own. It is a maximum, not a promise: Fusion also looks at PVC sizes, counts and earlier backups.');
  setTag('mx', 'MaxNumJobPods: a per-cluster maximum', 'big');
  await dwell(5500);

  say('<b>6. The pods work in parallel.</b> Each datamover reads its snapshots and sends the data to S3 at the same time, so the backup finishes sooner than with one pod.');
  await Promise.all([0, 1, 2, 3].map(k => ship([[nx3(k) + 102, 179], [nx3(k) + 102, 385], [480, 410]], 'w', 600)));
  await dwell(4000);

  say('<b>Result:</b> Backup work is spread over several pods and nodes. That speeds up large applications and keeps one node from reaching its volume-attach limit.');
}

/* ======================================================================
   Scene 2: full, then incremental, and change block tracking
   ====================================================================== */
const gx = i => 50 + 42 * (i % 6), gy = i => 80 + 42 * Math.floor(i / 6);
const bx4 = b => 410 + 175 * b;
const cxb = (b, i) => bx4(b) + 22 * (i % 6), cyb = i => 110 + 22 * Math.floor(i / 6);
const CH1 = [3, 9, 14, 20], CH2 = [1, 12, 22];
function build2() {
  cont('pvcc', 20, 40, 330, 260, 'App PVC (snapshot mounted separately)');
  for (let i = 0; i < 24; i++) cell('g' + i, gx(i), gy(i), 36, 'hot', true);
  tag('gl', 185, 275, 'Each square is a block of data', '');
  cont('rep', 390, 40, 550, 260, 'S3 repository');
  for (let b = 0; b < 3; b++) {
    tag('bl' + b, bx4(b) + 66, 98, 'Backup ' + (b + 1) + (b === 0 ? ' (full)' : ' (incremental)'), '');
    for (let i = 0; i < 24; i++) cell('c' + b + '_' + i, cxb(b, i), cyb(i), 18, 'off', true);
    box('rs' + b, bx4(b), 215, 132, 30, 'K8s resources', '', { h: true, c: 'purple' });
    tag('snt' + b, bx4(b) + 66, 272, '', '');
  }

  box('cbt', 480, 330, 460, 70, 'Change block detection', 'Ceph RBD volumes only', { h: true, c: 'good' });
  box('plan', 20, 412, 920, 52, 'Planning example from the docs: 2 TB application, 300 MB changes per day',
    'The first backup sends 2 TB. Each later daily backup sends about 300 MB.', { h: true, c: 'hot' });

function showBackup(b) { show('bl' + b); for (let i = 0; i < 24; i++) show('c' + b + '_' + i); }
async function scene2() {
  say('<b>1. Take a snapshot.</b> Fusion mounts the snapshot as a separate PVC and reads from that, so the running application is not affected.');
  for (let i = 0; i < 24; i++) show('g' + i);
  show('gl'); show('dmb'); showBackup(0);
  await dwell(4000);

  say('<b>2. The first backup is a full backup.</b> Every block is sent to the S3 repository. The Kubernetes resources (the YAML) are copied as well.');
  await ship([[176, 160], [476, 160]], 'w', 800);
  for (let i = 0; i < 24; i++) cc('c0_' + i, 'hot');
  show('rs0'); setTag('snt0', 'sent 24 of 24 blocks', 'good');
  await dwell(4500);

  say('<b>3. The app keeps running and changes some data.</b> Four blocks change since the first backup.');
  CH1.forEach(i => cc('g' + i, 'warn'));
  await dwell(3500);

  say('<b>4. The next backup is incremental.</b> Only new or changed data is sent. The data that was already copied is never sent again. Here the datamover reads the whole snapshot to work out what is new (simplified).');
  showBackup(1);
  setT('dmb', 'Datamover', 'reads all 24 blocks to find changes');
  for (let i = 0; i < 24; i++) { cc('g' + i, ((CH1.includes(i)) ? 'warn ' : 'hot ') + 'scan'); await wait(50); cc('g' + i, CH1.includes(i) ? 'warn' : 'hot'); }
  await ship([[gx(CH1[0]) + 18, gy(CH1[0]) + 18], [cxb(1, 0) + 66, 150]], 'o', 700);
  CH1.forEach(i => cc('c1_' + i, 'warn'));
  show('rs1'); setTag('snt1', 'sent 4 of 24 blocks', 'good');
  CH1.forEach(i => cc('g' + i, 'hot'));
  await dwell(5000);

  say('<b>5. Change block detection (CBT) makes this faster.</b> For volumes on Ceph RBD, Fusion can tell which blocks changed since the last snapshot. The app changes three more blocks.');
  show('cbt');
  CH2.forEach(i => cc('g' + i, 'warn'));
  await dwell(4500);

  say('<b>6. Backup 3 reads only the changed blocks.</b> There is no need to read all 24 to find them, so processing time drops. The same applies to virtual machine backups, which detect changed blocks since the last snapshot.');
  showBackup(2);
  setT('dmb', 'Datamover', 'reads only the 3 changed blocks');
  for (const i of CH2) { cc('g' + i, 'warn scan'); await wait(300); cc('g' + i, 'warn'); }
  await ship([[gx(CH2[0]) + 18, gy(CH2[0]) + 18], [cxb(2, 0) + 66, 150]], 'o', 700);
  CH2.forEach(i => cc('c2_' + i, 'warn'));
  show('rs2'); setTag('snt2', 'sent 3 of 24 blocks', 'good');
  CH2.forEach(i => cc('g' + i, 'hot'));
  await dwell(5000);

  say('<b>7. The resources are always copied in full.</b> The Kubernetes YAML is copied completely on every backup. It is a very small share of the total data.');
  ['rs0', 'rs1', 'rs2'].forEach(r => st(r, 'warn'));
  await dwell(4000);

  say('<b>Result:</b> First backup full, all later ones incremental, and CBT cuts the read time when the storage is Ceph RBD. That keeps both the network traffic and the S3 capacity needed small.');
  show('plan');
}

ACCCCAAAIIIIAAAggggAACCCCAAAIIIIBAcRYgoFecjx5tRwABBBBAAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQCHoBAnpBf4jpIAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAQHEWIKBXnI8ebUcAAQQQQAABBBBAAAEEEEAAAQQQQAABBBBAAAEEEAh6AQJ6QX+I6SACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggEBxFiCgV5yPHm1HAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQQAABBBAIegECekF/iOkgAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIBAcRYgoFecjx5tRwABBBBAAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQCHoBAnpBf4jpIAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAQHEWIKBXnI8ebUcAAQQQQAABBBBAAAEEEEAAAQQQQAABBBBAAAEEEAh6AQJ6QX+I6SACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggEBxFiCgV5yPHm1HAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQQAABBBAIegECekF/iOkgAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIBAcRYgoFecjx5tRwABBBBAAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQCHoBAnpBf4jpIAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAQHEWIKBXnI8ebUcAAQQQQAABBBBAAAEEEEAAAQQQQAABBBBAAAEEEAh6AQJ6QX+I6SACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggEBxFiCgV5yPHm1HAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQQAABBBAIegECekF/iOkgAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIBAcRYgoFecjx5tRwABBBBAAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQCHoBAnpBf4jpIAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAQHEWIKBXnI8ebUcAAQQQQAABBBBAAAEEEEAAAQQQQAABBBBAAAEEEAh6AQJ6QX+I6SACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggEBxFiCgV5yPHm1HAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQQAABBBAIegECekF/iOkgAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIBAcRYgoFecjx5tRwABBBBAAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQCHoBAnpBf4jpIAIIIIAAAggggAACCCCAAAIIIIAAAggggAACCCCAQHEWIKBXnI8ebUcAAQQQQAABBBBAAAEEEEAAAQQQQAABBBBAAAEEEAh6AQJ6QX+I6SACCCCAAAIIIIAAAggggAACCCCAAAIIIIAAAggggEBxFiCgV5yPHm1HAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQQAABBBAIegECekF/iOkgAggggAACCCCAAAIIIIAAAggggAACCCCAAAIIIIBAcRYgoFecjx5tRwABBBBAAAEEEEAAAQQQQAABBBBAAAEEEEAAAQQQCHqB/wOUN8LbmMy0lAAAAABJRU5ErkJggg==';
async function scene4() {
  say('<b>1. Without a recipe, the snapshot is taken at any moment.</b> The database may be in the middle of a write. This is a crash-consistent backup: not every application can recover cleanly from one.');
  showAll(['s3c', 'snap']);
  st('db', 'warn'); setT('db', 'Database pod', 'writing right now');
  setT('snap', 'Crash-consistent backup', 'may not restore for every app'); st('snap', 'warn');
  await ship([[165, 265], [165, 320], [820, 320], [820, 130]], 'o', 450);
  await dwell(5500);

  say('<b>2. Add a recipe.</b> It lives in the application namespace and has three parts: <b>groups</b> (which resources and PVCs), <b>hooks</b> (scripts, scale, checks) and a <b>workflow</b> (the order). The steps shown are an illustration, not the exact CP4BA recipe.');
  show('rcp'); show('wf'); st('db', ''); setT('db', 'Database pod', 'writes to its volume');
  setT('snap', 'Backup', ''); st('snap', ''); show('snap', false);
  WF.forEach((w, i) => show('w' + i));
  await ship([[250, 365], [350, 365], [350, 200]], 'r', 450);
  await dwell(5500);

  say('<b>3. Before the snapshot, get the app quiet.</b> The workflow scales the front end down, lists the resources and tells the database to pause writes (quiesce). This is the "quiesce" way to get consistency, and it accepts a short downtime.');
  act(0, true); await ship([[370, 76], [290, 90]], 'r', 450); st('ap', 'off'); setT('ap', 'Application pods', 'scaled down'); act(0, false);
  act(1, true); await wait(700); act(1, false);
  act(2, true); await ship([[370, 180], [290, 180]], 'r', 450); st('db', 'good'); setT('db', 'Database pod', 'quiesced'); act(2, false);
  await dwell(4500);

  say('<b>4. Take the snapshot while it is quiet.</b> The volumes group runs, and Fusion snapshots the PVCs. The data on disk is now consistent.');
  act(3, true);
  show('snap'); setT('snap', 'Backup', 'consistent snapshot'); st('snap', 'hot');
  await ship([[165, 265], [165, 320], [820, 320], [820, 130]], 'w', 450);
  act(3, false);
  await dwell(4500);

  say('<b>5. Resume.</b> The database is told to resume and the front end is scaled back up. The application was paused only for a short time. The data mover then copies the snapshot to S3.');
  act(4, true); await ship([[370, 180], [290, 180]], 'r', 450); st('db', ''); setT('db', 'Database pod', 'running again'); act(4, false);
  act(5, true); await ship([[370, 76], [290, 90]], 'r', 450); st('ap', ''); setT('ap', 'Application pods', 'running again'); act(5, false);
  setT('snap', 'Application-consistent backup', 'stored in S3'); st('snap', 'good');
  await dwell(5000);

  L.style.transition = 'opacity .5s'; L.style.opacity = 0;   // clear the diagram, then show the recipe availability slide
  const img = E('image', { href: RECIPE_IMG, x: 72, y: 10, width: 815, height: 460 }, svg);
  img.style.opacity = 0; img.style.transition = 'opacity .6s';
  img.getBoundingClientRect(); img.style.opacity = 1;
  say('<b>Result:</b> IBM has published recipes for a range of OpenShift workloads - <b style="color:inherit">a subset of which are available on GitHub</b>: <a href="https://github.com/IBM/storage-fusion/tree/master/backup-restore/recipes" target="_blank" rel="noopener">https://github.com/IBM/storage-fusion/tree/master/backup-restore/recipes</a> Through an OpenShift custom resource definition, a framework for users to write and assign their own recipes is also possible.');
}

/* ---------------- scene table, notes and engine ---------------- */
const BUILD = { 1: build1, 2: build2, 3: build3, 4: build4 };
const SCENES = { 1: scene1, 2: scene2, 3: scene3, 4: scene4 };
const NOTES = {
  1: 'Simplified illustration. The PVC sizes, which PVC uses which storage, the node count and the 10 per node limit are examples. How Fusion actually assigns PVCs to pods depends on several factors (see the scaling configuration parameters page). Any storage with a CSI driver that supports volume snapshots can be backed up.',
  2: 'Simplified illustration. Block counts are tiny so you can see them; real volumes have far more. How the datamover finds changes without CBT is simplified. CBT is documented for Ceph RBD volumes and virtual machine backups.',
  3: 'Simplified illustration. Based on the Fusion HCI 2.14 hub and spoke model and service architecture pages. Policy values and the S3 location are examples.',
  4: 'Simplified illustration. The workflow follows the shape of the Fusion recipe example (scale, groups, exec hooks), not a real recipe. Sample recipes for many applications are published in the IBM storage-fusion GitHub repository; check the Fusion documentation for how to assign and write them.'
};

function build() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  L = E('g', { id: 'layer-main' }, svg);
  BUILD[scene]();
  E('g', { id: 'layer-pk' }, svg);
  $('note').textContent = NOTES[scene];
}

// Next is enabled only in click-through mode and only while the scene has steps left.
let finished = false;
function updateNav() {
  $('nx').disabled = !stepMode || finished;
  $('pv').disabled = !stepMode || cur <= 0;
}

async function run(skip = 0) {
  const my = ++token;
  next();   // release any step still waiting on "Next" so it cancels
  ffwd = false;
  idx = 0; skipLeft = skip; skipping = skip > 0;
  finished = false; setCur(0);
  build();
  try {
    await SCENES[scene]();
    if (my === token) { finished = true; updateNav(); }
  } catch (e) { if (e !== 'cancel') throw e; }
}

function setScene(n) {
  scene = n;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', +b.dataset.s === n));
  run();
}
document.querySelectorAll('.tab').forEach(b => { b.onclick = () => setScene(+b.dataset.s); });
$('rs').onclick = () => { paused = false; $('pp').textContent = 'Pause'; run(); };
$('pp').onclick = () => { paused = !paused; $('pp').textContent = paused ? 'Play' : 'Pause'; };
$('md').onclick = () => {
  stepMode = !stepMode;
  $('md').textContent = stepMode ? 'Mode: Click-through' : 'Mode: Auto-play';
  updateNav();
  $('pp').disabled = stepMode;
  if (stepMode) { paused = false; $('pp').textContent = 'Pause'; }
  if (!stepMode) next();
};
$('nx').onclick = next;
$('pv').onclick = prev;
document.addEventListener('keydown', e => {
  if (!stepMode) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (!finished) next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});
$('sp').onchange = e => { speed = parseFloat(e.target.value); };
run();
</script>
